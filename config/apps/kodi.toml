# Kodi with its built-in Wayland windowing.
id = "kodi"
name = "Kodi"
# ~/.local/bin/kodi-tile (config/kodi-tile): Kodi on its own home with CEC off, see the script.
launch = "~/.local/bin/kodi-tile"
background = "close-on-exit"
exclusive = true
app_id = "Kodi"
icon = "kodi"
glyph = "K"
colors = ["#0d3b5c", "#17b2e7"]
order = 40
