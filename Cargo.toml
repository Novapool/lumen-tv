[workspace]
members = [".", "helper"]

[package]
name = "lumen-tv"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Lumen: a couch-first launcher for the Raspberry Pi 5"

[dependencies]
# femtovg only: Skia was slower on the Pi 5 at every resolution (tag spike-slint-2026-10-08, REPORT.md).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"
serde_json = "1"
# Icons: SVG via usvg, PNG via tiny_skia (both re-exported). No text/font features: tile icons are shapes.
resvg = { version = "0.48", default-features = false }

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
inotify = "0.11"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"
