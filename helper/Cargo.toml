[package]
name = "lumen-helper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Lumen's root install helper: PIN-gated apt installs from a root-owned allowlist"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.7"
argon2 = "0.5"
libc = "0.2"
