[package]
name = "lumen-tv"
version = "0.1.0"
edition = "2021"
description = "Lumen: a couch-first launcher for the Raspberry Pi 5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Plain `cargo build` should load the bundled UI (ui/dist), not the Vite dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
